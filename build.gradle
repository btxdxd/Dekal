plugins {
    id 'java'
    id 'org.graalvm.buildtools.native' version '1.1.14'
}

group = 'btxds.dekal'
version = '0.1.0'

repositories {
    mavenCentral()
}

dependencies {
}

graalvmNative {
    binaries {
        main {
            imageName = 'file-name'
            mainClass = 'btxds.dekal.Main'
            quickBuild = true
            buildArgs.addAll([
                    '-H:NumberOfThreads=10',
                    '-J-Xmx6G',
                    '-H:NativeLinkerOption=/SUBSYSTEM:WINDOWS',
                    '-H:NativeLinkerOption=/ENTRY:mainCRTStartup'
            ])
        }
    }
}